server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Salud del servidor estático; el balanceador comprueba esta ruta.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Angular resuelve sus rutas en el navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
