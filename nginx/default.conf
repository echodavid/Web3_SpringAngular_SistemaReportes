# Balanceo round-robin entre las tres instancias del backend.
# Las IP fijas se asignan en compose.yaml y se conservan al recrear contenedores.
upstream reportes_backend {
    zone reportes_backend 64k;
    server 172.28.90.21:8080 max_fails=1 fail_timeout=5s;
    server 172.28.90.22:8080 max_fails=1 fail_timeout=5s;
    server 172.28.90.23:8080 max_fails=1 fail_timeout=5s;
    keepalive 16;
}

# Permite comprobar qué instancia atendió cada petición sin exponerlo al cliente.
log_format balanceo escape=json
    '{"request":"$request","status":$status,"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status"}';

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    access_log /var/log/nginx/access.log balanceo;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # Reintentos limitados; no se habilita non_idempotent para no repetir POST/PATCH.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;

    # Salud del propio balanceador; no se reenvía.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API y documentación se reparten entre backend1, backend2 y backend3.
    location /api/ {
        proxy_pass http://reportes_backend;
    }

    location = /actuator/health {
        proxy_pass http://reportes_backend;
    }

    location /v3/api-docs {
        proxy_pass http://reportes_backend;
    }

    location = /swagger-ui {
        proxy_pass http://reportes_backend;
    }

    location = /swagger-ui.html {
        proxy_pass http://reportes_backend;
    }

    location /swagger-ui/ {
        proxy_pass http://reportes_backend;
    }

    # El frontend es un servidor Nginx interno que solo entrega estáticos.
    location / {
        proxy_pass http://172.28.90.30:80;
    }
}
