name: pr07-p04

x-backend: &backend
  image: pr07-p04-backend:latest
  build: ./BackendP04
  environment:
    DB_URL: jdbc:postgresql://172.28.90.10:5432/reportes_ciudadanos
    DB_USERNAME: reportes
    DB_PASSWORD: ${DB_PASSWORD:?Ejecuta scripts/setup-env.sh}
    JWT_SECRET: ${JWT_SECRET:?Ejecuta scripts/setup-env.sh}
    SPRING_PROFILES_ACTIVE: demo
    DEMO_PASSWORD: ${DEMO_PASSWORD:?Ejecuta scripts/setup-env.sh}
    CORS_ORIGINS: http://localhost:4200
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
    start_period: 40s
    interval: 10s
    timeout: 5s
    retries: 12
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: reportes_ciudadanos
      POSTGRES_USER: reportes
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Ejecuta scripts/setup-env.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      app_net:
        ipv4_address: 172.28.90.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reportes -d reportes_ciudadanos"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend1:
    <<: *backend
    networks:
      app_net:
        ipv4_address: 172.28.90.21

  backend2:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
      backend1:
        condition: service_healthy
    networks:
      app_net:
        ipv4_address: 172.28.90.22

  backend3:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
      backend1:
        condition: service_healthy
    networks:
      app_net:
        ipv4_address: 172.28.90.23

  frontend:
    build: ./FrontendP04
    networks:
      app_net:
        ipv4_address: 172.28.90.30
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:4200:80"
      - "127.0.0.1:${API_PORT:-8080}:80"
    networks:
      app_net:
        ipv4_address: 172.28.90.40
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  e2e:
    profiles: ["e2e"]
    build:
      context: ./FrontendP04
      dockerfile: Dockerfile.e2e
    user: "${E2E_UID:-1000}:${E2E_GID:-1000}"
    environment:
      HOME: /tmp
      FRONTEND_URL: http://lb
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Ejecuta scripts/setup-env.sh}
      EVIDENCE_DIR: /evidence
      PLAYWRIGHT_OUTPUT_DIR: /evidence/test-results
    volumes:
      - ./docs/evidence:/evidence
    depends_on:
      lb:
        condition: service_healthy
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.90.0/24

volumes:
  pgdata:
